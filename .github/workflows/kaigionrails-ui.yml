on:
  push:
    branches:
      - kaigionrails

jobs:
  deploy:
    name: deploy
    if: github.repository == 'kaigionrails/signage-app'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: prd
      url: https://signage.kaigionrails.org
    concurrency:
      group: prd
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: "ap-northeast-1"
          role-skip-session-tagging: true
          role-to-assume: "arn:aws:iam::861452569180:role/SignageAppDeployer"
          mask-aws-account-id: 'false'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'
      - run: npm ci
        working-directory: './ui'
      - run: npm run build
        working-directory: './ui'
        env:
          VITE_REVISION: '${{ github.sha }}.gh${{ github.run_number }}'
      - run: bundle exec ruby deploy.rb kor-signage-app-prd
        working-directory: './ui'
